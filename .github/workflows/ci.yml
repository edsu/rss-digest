name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor in requires-python
        python-version: ["3.12", "3.13"]

    # Job-level so every uv step below agrees on the interpreter, not just the sync
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      # Full version: setup-uv publishes no floating major tag (no v10, v9, v8)
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked also fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - run: uv run pytest

      - run: uv run ty check

      # --check fails on unformatted files; plain `ruff format` would reformat
      # them and exit 0, so CI would pass without checking anything
      - run: uv run ruff format --check
